<footer class="footer">
  <div class="footer-content">
    <div class="footer-social">
      <a *ngFor="let link of socialLinks" 
         [href]="link.url" 
         target="_blank" 
         rel="noopener"
         class="social-link"
         [attr.aria-label]="link.label">
        <i [class]="link.icon"></i>
      </a>
    </div>

    <div class="footer-text">
      <p>Designed & Built by <span class="highlight">Kolli Teja</span></p>
      <p class="copyright">&copy; {{ currentYear }} All rights reserved</p>
    </div>

    <button class="scroll-top" (click)="scrollToTop()" aria-label="Scroll to top">
      <i class="fas fa-arrow-up"></i>
    </button>
  </div>
</footer>
