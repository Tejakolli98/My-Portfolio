<section id="contact" class="contact-section">
  <div class="container">
    <h2 class="section-title">
      <span class="section-number">04.</span>
      Get In Touch
    </h2>

    <div class="contact-content">
      <div class="contact-info">
        <h3>Let's Work Together</h3>
        <p>
          I'm currently looking for new opportunities. Whether you have a question 
          or just want to say hi, my inbox is always open!
        </p>

        <div class="social-links">
          <a *ngFor="let link of socialLinks" 
             [href]="link.url" 
             target="_blank" 
             rel="noopener"
             class="social-link"
             [attr.aria-label]="link.label">
            <i [class]="link.icon"></i>
          </a>
        </div>
      </div>

      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input 
            type="text" 
            id="name" 
            formControlName="name"
            [class.error]="name?.invalid && name?.touched"
            placeholder="Your name">
          <div class="error-message" *ngIf="name?.invalid && name?.touched">
            <span *ngIf="name?.errors?.['required']">Name is required</span>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email"
            [class.error]="email?.invalid && email?.touched"
            placeholder="your.email@example.com">
          <div class="error-message" *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Valid email required</span>
          </div>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input 
            type="text" 
            id="subject" 
            formControlName="subject"
            [class.error]="subject?.invalid && subject?.touched"
            placeholder="What's this about?">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea 
            id="message" 
            formControlName="message"
            [class.error]="message?.invalid && message?.touched"
            rows="6"
            placeholder="Your message..."></textarea>
        </div>

        <button type="submit" class="btn-submit" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Send Message</span>
          <span *ngIf="isSubmitting">Sending...</span>
        </button>

        <div class="success-message" *ngIf="submitSuccess">
          <i class="fas fa-check-circle"></i>
          Message sent successfully!
        </div>
      </form>
    </div>
  </div>
</section>
